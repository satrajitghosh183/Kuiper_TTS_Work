[project]
name = "pdf-to-latex"
version = "1.0.0"
description = "Agentic PDF-to-LaTeX Conversion System using Vision Language Models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "PDF-to-LaTeX Team"}
]
keywords = ["pdf", "latex", "ocr", "vlm", "document-conversion", "huggingface"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

dependencies = [
    "huggingface-hub>=0.20.0",
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.23.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "aiofiles>=23.0.0",
    "structlog>=24.0.0",
    "slowapi>=0.1.9",
    "prometheus-client>=0.19.0",
    "httpx>=0.26.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
local = [
    "accelerate>=0.28.0",
    "flash-attn>=2.5.0",
    "bitsandbytes>=0.42.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
all = [
    "pdf-to-latex[local,dev]",
]

[project.scripts]
pdf-to-latex = "app.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/pdf-to-latex"
Documentation = "https://github.com/your-org/pdf-to-latex#readme"
Repository = "https://github.com/your-org/pdf-to-latex"
Issues = "https://github.com/your-org/pdf-to-latex/issues"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing"

