# API Deployment for PDF-to-LaTeX
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-latex-api
  namespace: pdf-to-latex
  labels:
    app: pdf-to-latex
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pdf-to-latex
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: pdf-to-latex
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: pdf-latex-sa
      containers:
      - name: api
        image: ghcr.io/your-org/pdf-to-latex-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: pdf-latex-secrets
              key: hf-token
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: pdf-latex-secrets
              key: api-key
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: CELERY_BROKER_URL
          value: "redis://redis-service:6379/0"
        - name: CELERY_RESULT_BACKEND
          value: "redis://redis-service:6379/1"
        envFrom:
        - configMapRef:
            name: pdf-latex-config
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        - name: outputs
          mountPath: /app/outputs
        - name: figures
          mountPath: /app/figures
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: uploads-pvc
      - name: outputs
        persistentVolumeClaim:
          claimName: outputs-pvc
      - name: figures
        persistentVolumeClaim:
          claimName: figures-pvc
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values:
                  - api
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: pdf-latex-service
  namespace: pdf-to-latex
  labels:
    app: pdf-to-latex
    component: api
spec:
  selector:
    app: pdf-to-latex
    component: api
  ports:
  - port: 80
    targetPort: 8000
    name: http
  type: LoadBalancer

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pdf-latex-sa
  namespace: pdf-to-latex
  labels:
    app: pdf-to-latex

---
# Storage for uploads
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
  namespace: pdf-to-latex
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
# Storage for outputs
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: outputs-pvc
  namespace: pdf-to-latex
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
# Storage for figures
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: figures-pvc
  namespace: pdf-to-latex
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard

