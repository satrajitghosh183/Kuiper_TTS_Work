# Ingress for PDF-to-LaTeX API
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pdf-latex-ingress
  namespace: pdf-to-latex
  labels:
    app: pdf-to-latex
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "30"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
  - hosts:
    - api.pdf-to-latex.example.com
    secretName: pdf-latex-tls
  rules:
  - host: api.pdf-to-latex.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pdf-latex-service
            port:
              number: 80

