# Redis deployment for PDF-to-LaTeX
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: pdf-to-latex
  labels:
    app: pdf-to-latex
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdf-to-latex
      component: redis
  template:
    metadata:
      labels:
        app: pdf-to-latex
        component: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command:
        - redis-server
        - --appendonly
        - "yes"
        - --maxmemory
        - "512mb"
        - --maxmemory-policy
        - allkeys-lru
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: pdf-to-latex
  labels:
    app: pdf-to-latex
    component: redis
spec:
  selector:
    app: pdf-to-latex
    component: redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: pdf-to-latex
  labels:
    app: pdf-to-latex
    component: redis
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard

