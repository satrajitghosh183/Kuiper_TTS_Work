# Kubernetes ConfigMap for PDF-to-LaTeX configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: pdf-latex-config
  namespace: pdf-to-latex
  labels:
    app: pdf-to-latex
data:
  # Hugging Face settings
  HF_MODEL_ID: "Qwen/Qwen2.5-VL-7B-Instruct"
  HF_USE_INFERENCE_API: "true"

  # API settings
  LOG_LEVEL: "INFO"
  MAX_FILE_SIZE_MB: "50"
  RATE_LIMIT_PER_MINUTE: "30"
  TASK_TIMEOUT: "600"
  MAX_WORKERS: "4"

  # LaTeX settings
  DEFAULT_DOCUMENT_CLASS: "article"
  DPI: "200"

