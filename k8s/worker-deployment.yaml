# Worker Deployment for PDF-to-LaTeX
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-latex-worker
  namespace: pdf-to-latex
  labels:
    app: pdf-to-latex
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pdf-to-latex
      component: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: pdf-to-latex
        component: worker
    spec:
      serviceAccountName: pdf-latex-sa
      containers:
      - name: worker
        image: ghcr.io/your-org/pdf-to-latex-api:latest
        imagePullPolicy: Always
        command: ["celery", "-A", "app.worker", "worker", "-l", "info", "-c", "2"]
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: pdf-latex-secrets
              key: hf-token
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: CELERY_BROKER_URL
          value: "redis://redis-service:6379/0"
        - name: CELERY_RESULT_BACKEND
          value: "redis://redis-service:6379/1"
        envFrom:
        - configMapRef:
            name: pdf-latex-config
        resources:
          requests:
            memory: "4Gi"
            cpu: "1000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        - name: outputs
          mountPath: /app/outputs
        - name: figures
          mountPath: /app/figures
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: uploads-pvc
      - name: outputs
        persistentVolumeClaim:
          claimName: outputs-pvc
      - name: figures
        persistentVolumeClaim:
          claimName: figures-pvc
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values:
                  - worker
              topologyKey: kubernetes.io/hostname

---
# Celery Beat for scheduled tasks
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-latex-beat
  namespace: pdf-to-latex
  labels:
    app: pdf-to-latex
    component: beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdf-to-latex
      component: beat
  template:
    metadata:
      labels:
        app: pdf-to-latex
        component: beat
    spec:
      serviceAccountName: pdf-latex-sa
      containers:
      - name: beat
        image: ghcr.io/your-org/pdf-to-latex-api:latest
        imagePullPolicy: Always
        command: ["celery", "-A", "app.worker", "beat", "-l", "info"]
        env:
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: CELERY_BROKER_URL
          value: "redis://redis-service:6379/0"
        - name: CELERY_RESULT_BACKEND
          value: "redis://redis-service:6379/1"
        envFrom:
        - configMapRef:
            name: pdf-latex-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

