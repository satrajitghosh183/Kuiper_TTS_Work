# Kubernetes secrets for PDF-to-LaTeX
# NOTE: In production, use external secrets management (Vault, AWS Secrets Manager, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: pdf-latex-secrets
  namespace: pdf-to-latex
  labels:
    app: pdf-to-latex
type: Opaque
stringData:
  # Replace with your actual tokens (base64 encoded in production)
  hf-token: "your-huggingface-token-here"
  api-key: "your-api-key-here"
  redis-password: "your-redis-password-here"

